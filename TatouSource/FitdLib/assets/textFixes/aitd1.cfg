# Corrections of Alone in the Dark's texts (core/textFixes.cpp), compiled into
# the game. One per line:  LANGUAGE number = text
# LANGUAGE: the language file (ENGLISH, FRANCAIS, DEUTSCH, ITALIANO, ESPAGNOL);
# number: the text's number in it (@number:); text in UTF-8, without the
# rest of the line's spaces at its ends. The game measures the new text, so
# a longer one may change a line or a page.
