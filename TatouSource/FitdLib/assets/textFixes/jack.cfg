# Corrections of Jack in the Dark's texts (core/textFixes.cpp), compiled into
# the game. One per line:  LANGUAGE number = text
# LANGUAGE: the language file (ENGLISH, FRANCAIS, DEUTSCH, ITALIANO, ESPAGNOL);
# number: the text's number in it (@number:); text in UTF-8, without the
# rest of the line's spaces at its ends. The game measures the new text, so
# a longer one may change a line or a page.

# The lamp's action said "Vacío", the adjective ("Empty" in English, "Vider"
# in French): it did not look like an action (BUGS.md J5)
ESPAGNOL 27 = Vaciar

# The pause menu, as in Alone 1's Spanish: the accent of "Música", and the
# message of a failed save with its opening sign and no capital in "salvado"
ESPAGNOL 41 = Música NO
ESPAGNOL 42 = Música SI
ESPAGNOL 52 = ¡Error! Juego no salvado
