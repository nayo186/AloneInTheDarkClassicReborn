# Builds the players' packages when a release is published and attaches them
# to the release. Same steps as on a local PC: tools/makeRelease.ps1 (Windows)
# and tools/makeRelease.sh (Linux), tools/makeRelease-macos.sh (macOS),
# tools/makeRelease-android.sh (Android): Release build, without the development
# tools F9/F10, C++ runtime inside the executables, only the launcher, the
# game, README.md, LICENSE and Gelasio-OFL.txt (the menu font's license) in
# the package.
#
# To publish a version: create a release on GitHub with a tag like
# v1.0.0-beta.1; ClassicReborn-1.0.0-beta.1-windows-x64.zip,
# ClassicReborn-1.0.0-beta.1-linux-x64.tar.gz, ClassicReborn-1.0.0-beta.1-macos.tar.gz and
# ClassicReborn-1.0.0-beta.1-android.apk
# appear in it when the builds end. It can also be run by hand for an existing tag.

name: Release zip

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. v1.0.0-beta.1)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and pack
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          ./tools/makeRelease.ps1 -Version $version

      - name: Attach the zip to the release
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          gh release upload $env:TAG "release/ClassicReborn-$version-windows-x64.zip" --clobber

  # Ubuntu 22.04: the oldest system the package is built on is the oldest it
  # runs on (Ubuntu 22.04, Mint 21, Debian 12 and newer)
  linux:
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxfixes-dev libxinerama-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            wayland-protocols libdecor-0-dev libgl1-mesa-dev libegl1-mesa-dev \
            libgles2-mesa-dev libdrm-dev libgbm-dev libasound2-dev libpulse-dev \
            libpipewire-0.3-dev libudev-dev libdbus-1-dev libibus-1.0-dev

      - name: Build and pack
        run: bash tools/makeRelease.sh "${TAG#v}"

      - name: Attach the package to the release
        run: gh release upload "$TAG" "release/ClassicReborn-${TAG#v}-linux-x64.tar.gz" --clobber

  # macOS 11 or newer, one program for Apple Silicon and Intel (experimental:
  # built and started on GitHub's Macs, played by players with a Mac)
  macos:
    runs-on: macos-15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install the build tools
        run: brew install ninja

      - name: Build and pack
        run: bash tools/makeRelease-macos.sh "${TAG#v}"

      - name: Attach the package to the release
        run: gh release upload "$TAG" "release/ClassicReborn-${TAG#v}-macos.tar.gz" --clobber

  # Android 7 or newer, arm64 phones (experimental). Signed with the
  # project's key (secrets ANDROID_KEYSTORE_BASE64 and
  # ANDROID_KEYSTORE_PASSWORD): Android only updates the app with one signed
  # with the same key
  android:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install the NDK and CMake of the project
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Build and sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/classicreborn.jks"
          export CLASSIC_REBORN_KEYSTORE="$RUNNER_TEMP/classicreborn.jks"
          export CLASSIC_REBORN_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          export CLASSIC_REBORN_KEY_ALIAS=classicreborn
          export CLASSIC_REBORN_KEY_PASSWORD="$KEYSTORE_PASSWORD"
          bash tools/makeRelease-android.sh "${TAG#v}"
          rm -f "$RUNNER_TEMP/classicreborn.jks"

      - name: Attach the app to the release
        run: gh release upload "$TAG" "release/ClassicReborn-${TAG#v}-android.apk" --clobber
